server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support for React Router (Single Page Application fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy requests to backend if needed (though the frontend calls localhost:8000 directly from the browser)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
